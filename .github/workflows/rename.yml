name: Rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git mv koi-restaurant-website.html index.html
          git config user.name "meamitacharya"
          git config user.email "meamitacharya@users.noreply.github.com"
          git commit -m "Rename koi-restaurant-website.html to index.html"
          git push
